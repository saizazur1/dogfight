<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dogfight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #fff; --panel: rgba(12, 14, 20, 0.62); --accent: #ffb43a; --danger: #ff4d3d; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: var(--ink); font-family: Rubik, system-ui, sans-serif; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #credit { position: fixed; left: 8px; bottom: 6px; font: 9px/1.2 system-ui, sans-serif; color: rgba(255,255,255,.55); pointer-events: none; max-width: 70vw; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; text-align: center; }
  .card { background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 18px; padding: 28px 40px; }
  .title { font-weight: 800; font-size: 44px; letter-spacing: .04em; }
  .sub { font-weight: 500; opacity: .8; font-size: 14px; }
  .bar { width: 260px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; margin: 0 auto; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #fps { position: fixed; top: 8px; right: 10px; font: 700 13px Rubik, system-ui, sans-serif; color: rgba(255,255,255,.8); pointer-events: none; }
  .hidden { display: none !important; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
    "peerjs": "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/+esm",
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/+esm"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud"></div>
<div id="credit"></div>

<div class="overlay" id="loading">
  <div class="card">
    <div class="title">DOGFIGHT</div>
    <div class="sub" id="loadText">Loading the mountains…</div>
    <div class="bar" style="margin-top:14px"><i id="loadBar"></i></div>
  </div>
</div>

<div id="menu"></div>
<div id="fps" class="hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
